name: Generate Snake Game

# Permissões necessárias para poder commitar de volta no repo
permissions:
  contents: write

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          # permite usar o GITHUB_TOKEN para push (true é padrão, mas declarado para deixar explícito)
          persist-credentials: true

      - name: Ensure output dir exists
        run: mkdir -p output

      - name: Generate Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: FelipeSantos211
          outputs: output/github-contribution-grid-snake.svg

      - name: Show files for debugging
        run: |
          echo "=== repo root ==="
          ls -la
          echo "=== output dir ==="
          ls -la output || true

      - name: Commit Snake Animation
        uses: EndBug/add-and-commit@v9
        with:
          message: "generated snake game"
          add: "output/github-contribution-grid-snake.svg"
          # usa o GITHUB_TOKEN automaticamente se persist-credentials: true estiver setado
